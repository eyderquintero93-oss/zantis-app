<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zantis - Registro de Usuario</title>
    <link rel="stylesheet" href="../css/index.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: #2ea44f;
            margin: 0;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card h2 {
            color: #fff;
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #fff;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #0d1117;
            color: #fff;
            box-sizing: border-box;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #8b949e;
        }

        .btn-submit {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h1>Zantis</h1>
        </div>
        <nav>
            <a href="index.html">Volver al Inicio</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>Crear Cuenta en Zantis</h2>
            <form action="../php/registro.php" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="rol">Selecciona tu Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="empleado">Buscador de Empleo (Empleado)</option>
                        <option value="empresa">Empresa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipo_doc">Tipo de Documento</label>
                    <select id="tipo_doc" name="tipo_doc" required>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="TI">Tarjeta de Identidad</option>
                        <option value="NIT">NIT (Empresas)</option>
                        <option value="CE">Cédula de Extranjería</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="num_doc">Número de Documento</label>
                    <input type="text" id="num_doc" name="num_doc" placeholder="Ej. 1032019210" required>
                </div>

                <div class="form-group">
                    <label for="nombres">Nombres / Razón Social</label>
                    <input type="text" id="nombres" name="nombres" placeholder="Tus nombres" required>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required>
                </div>

                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento / Creación</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>

                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="Tu edad" required>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección / Ciudad</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Ej. Cl. 53 # 26 - 49, Medellín" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <div class="form-group">
                    <label for="info_laboral">Perfil o Información Laboral</label>
                    <textarea id="info_laboral" name="info_laboral" rows="4" placeholder="Cuéntanos brevemente sobre tu experiencia o habilidades..."></textarea>
                </div>

                <div class="form-group">
                    <label for="fotos">Foto de Perfil (Opcional)</label>
                    <input type="file" id="fotos" name="fotos" accept="image/*">
                </div>

                <button type="submit" class="btn-submit">Registrarse Ahora</button>
            </form>
        </div>
    </div>

</body>
</html>
